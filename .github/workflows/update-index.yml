name: Update OTA Index

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger
  repository_dispatch:  # Allow device repos to trigger updates
    types: [update-index]
  push:
    branches: [master, main]
    paths:
      - 'repos.yaml'
      - 'update_index.py'
      - '.github/workflows/update-index.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need write access to push to gh-pages
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run index aggregator
        run: |
          python3 update_index.py repos.yaml ota_index.json

      - name: Display generated indexes
        run: |
          echo "=== Stable OTA index ==="
          cat ota_index.json
          if [ -f ota_index_beta.json ]; then
            echo ""
            echo "=== Beta OTA index ==="
            cat ota_index_beta.json
          fi

      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp ota_index.json publish/
          if [ -f ota_index_beta.json ]; then
            cp ota_index_beta.json publish/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: false
          commit_message: "chore: update OTA indexes from configured repositories"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Summary
        run: |
          echo "✓ OTA indexes updated and deployed to GitHub Pages"
          echo ""
          echo "Stable: https://${{ github.repository_owner }}.github.io/zigbee-ota-index/ota_index.json"
          if [ -f ota_index_beta.json ]; then
            echo "Beta:   https://${{ github.repository_owner }}.github.io/zigbee-ota-index/ota_index_beta.json"
          fi
